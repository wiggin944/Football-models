name: Global Alpha v16 as-of fundamentals source quality gate
on:
  push:
    branches:
      - research/global-alpha-v16-broad-pit-source
    paths:
      - research/global_alpha/**
      - .github/workflows/global-alpha-v13b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Parquet research dependencies
        run: python -m pip install pandas pyarrow requests
      - name: Probe source under personal research licence
        run: python -u research/global_alpha/v16_source_audit.py 2>&1 | tee v16_source_audit.log
      - name: Preserve full source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-alpha-v16-source-audit
          path: |
            results/v16_data_source_audit.json
            v16_source_audit.log
          if-no-files-found: warn
          retention-days: 30
