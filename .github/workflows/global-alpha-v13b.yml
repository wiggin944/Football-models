name: Global Alpha v15B official SEC source availability
on:
  push:
    branches:
      - research/global-alpha-v15b-sec-official-probe
    paths:
      - research/global_alpha/**
      - .github/workflows/global-alpha-v13b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sec-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install requests
      - name: Limited read-only SEC access check
        run: python -u research/global_alpha/v15b_sec_official_probe.py 2>&1 | tee v15b_sec_source.log
      - name: Save status diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-alpha-v15b-sec-source
          path: |
            results/v15b_official_sec_source_probe.json
            v15b_sec_source.log
          if-no-files-found: warn
