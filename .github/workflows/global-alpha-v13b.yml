name: Global Alpha v16B pooled global peer-anomaly ML
on:
  push:
    branches:
      - research/global-alpha-v16b-pooled-peer-ml
    paths:
      - research/global_alpha/**
      - .github/workflows/global-alpha-v13b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pooled-global-peer:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical & market data dependencies
        run: python -m pip install numpy pandas scikit-learn requests yfinance
      - name: Validate code syntax
        run: python -m py_compile research/global_alpha/v16b_pooled_peer_ml.py
      - name: Execute pooled global nonlinear peer ablation
        run: python -u research/global_alpha/v16b_pooled_peer_ml.py 2>&1 | tee v16b_peer_ml.log
      - name: Upload complete results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-alpha-v16b-peer-ml-results
          path: |
            results/v16b_global_peer_ml.json
            v16b_peer_ml.log
          if-no-files-found: warn
          retention-days: 30
