name: Global Alpha v22 index-exit adjusted-price continuity audit
on:
  push:
    branches:
      - research/global-alpha-v22-exit-price-audit
    paths:
      - research/global_alpha/v22_exit_price_continuity.py
      - .github/workflows/global-alpha-v13b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install price-check dependencies
        run: python -m pip install pandas numpy requests yfinance scikit-learn
      - name: Confirm source is syntactically valid
        run: python -m py_compile research/global_alpha/v22_exit_price_continuity.py
      - name: Verify original versus independent adjusted price histories
        run: |
          set -o pipefail
          python -u research/global_alpha/v22_exit_price_continuity.py 2>&1 | tee v22_continuity.log
      - name: Save strict historical exit-return audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-alpha-v22-index-exit-continuity
          path: |
            results/v22_exit_price_continuity_audit.json
            v22_continuity.log
          if-no-files-found: warn
          retention-days: 60
