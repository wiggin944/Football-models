name: Global Alpha v27 fixed global quality-value-momentum benchmark
on:
  push:
    branches:
      - research/global-alpha-v27-simple-global-factors
    paths:
      - research/global_alpha/v27_simple_global_factor_backtest.py
      - .github/workflows/global-alpha-v13b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  global-factor-hypothesis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install research dependencies
        run: python -m pip install numpy pandas requests
      - name: Static validation of frozen global-factor weights
        run: python -m py_compile research/global_alpha/v27_simple_global_factor_backtest.py
      - name: Run 1995-2026 dividend-inclusive US, developed-ex-US and emerging portfolio experiment
        run: |
          set -o pipefail
          python -u research/global_alpha/v27_simple_global_factor_backtest.py 2>&1 | tee v27_global_factor_backtest.log
      - name: Preserve original research-source ZIPs, monthly returns and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-alpha-v27-frozen-multifactor-research
          path: |
            results/original_french_source_archives/*.zip
            results/v27_monthly_factor_returns.csv
            results/v27_global_factor_research.json
            v27_global_factor_backtest.log
          if-no-files-found: warn
          retention-days: 75
