name: Global Alpha v13B exploratory global pilot
on:
  push:
    branches:
      - research/global-alpha-v13-global-backtest
    paths:
      - research/global_alpha/**
      - .github/workflows/global-alpha-v13b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  global-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn requests
      - name: Execute five-region historical backtest
        run: |
          python -u research/global_alpha/v13b_global_pilot.py 2>&1 | tee global_alpha_run.log
      - name: Publish logs and regional results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-alpha-v13b-results
          path: |
            results/
            global_alpha_run.log
          if-no-files-found: warn
          retention-days: 30
