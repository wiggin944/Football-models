name: Global Alpha v20 full historical US SEC filing population
on:
  push:
    branches:
      - research/global-alpha-v20-full-us-point-in-time
    paths:
      - research/global_alpha/**
      - .github/workflows/global-alpha-v13b.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  full-us-source:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install required packages
        run: python -m pip install duckdb pandas pyarrow numpy scikit-learn requests yfinance zstandard
      - name: Compile expanded original SEC filing extract
        run: python -m py_compile research/global_alpha/v20_full_us_original_filing.py
      - name: Extract all historically observed S&P securities with original SEC filing vintages
        run: |
          set -o pipefail
          python -u research/global_alpha/v20_full_us_original_filing.py 2>&1 | tee global_alpha_v20_raw.log
      - name: Save expanded historical issuer source and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-alpha-v20-full-us-original-filings
          path: |
            results/v20_original_sec_facts.parquet
            results/v20_us_security_mapping.parquet
            results/v20_full_us_source_audit.json
            global_alpha_v20_raw.log
          if-no-files-found: warn
          retention-days: 60
