name: Global Alpha v20C ESEF European original publication time audit
on:
  push:
    branches:
      - research/global-alpha-v20c-europe-filings
    paths:
      - research/global_alpha/v20c_europe_esef_source_probe.py
      - .github/workflows/global-alpha-v13b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  europe-esef:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install requests
      - name: Validate code
        run: python -m py_compile research/global_alpha/v20c_europe_esef_source_probe.py
      - name: Download static ESEF yearly index and inspect original published dates
        run: |
          set -o pipefail
          python -u research/global_alpha/v20c_europe_esef_source_probe.py 2>&1 | tee v20c_esef.log
      - name: Preserve date/source audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-alpha-v20c-europe-filings-publication
          path: |
            results/v20c_eu_filings_publication_gate.json
            v20c_esef.log
          if-no-files-found: warn
          retention-days: 50
