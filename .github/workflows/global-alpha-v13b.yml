name: Global Alpha v24 historical US membership integrity check
on:
  push:
    branches:
      - research/global-alpha-v24-pit-membership-audit
    paths:
      - research/global_alpha/v24_us_membership_vs_price.py
      - research/global_alpha/global_security_master.py
      - .github/workflows/global-alpha-v13b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  membership-data-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install source and modelling packages
        run: python -m pip install numpy pandas scikit-learn requests yfinance
      - name: Validate worldwide listing identity and fail-closed intraday data gates
        run: python research/global_alpha/global_security_master.py
      - name: Compile audit
        run: python -m py_compile research/global_alpha/v24_us_membership_vs_price.py
      - name: Measure historical index-membership versus price-eligibility mismatch
        run: |
          set -o pipefail
          python -u research/global_alpha/v24_us_membership_vs_price.py 2>&1 | tee v24_membership_audit.log
      - name: Preserve historical integrity findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-alpha-v24-membership-source-audit
          path: |
            results/v24_us_membership_vs_price_coverage.json
            v24_membership_audit.log
          if-no-files-found: warn
          retention-days: 50
