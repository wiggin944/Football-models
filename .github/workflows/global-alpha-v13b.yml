name: Global Alpha v28 one-portfolio replacement and risk tests
on:
  push:
    branches:
      - research/global-alpha-v28-joint-opportunity-engine
    paths:
      - research/global_alpha/v28_joint_opportunity_allocator.py
      - .github/workflows/global-alpha-v13b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  joint-decision-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic optimisation dependencies
        run: python -m pip install numpy scipy
      - name: Run synthetic combined buy-hold-sell, dividend and risk tests
        run: |
          set -o pipefail
          python -m py_compile research/global_alpha/v28_joint_opportunity_allocator.py
          python -u research/global_alpha/v28_joint_opportunity_allocator.py 2>&1 | tee v28_joint_allocator_test.log
      - name: Archive audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-alpha-v28-joint-opportunity-tests
          path: v28_joint_allocator_test.log
          if-no-files-found: error
          retention-days: 50
