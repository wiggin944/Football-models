name: Global Alpha v14 source probe
on:
  push:
    branches:
      - research/global-alpha-v14-forward-holdout
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install research dependencies
        run: python -m pip install numpy pandas scikit-learn requests yfinance
      - name: Test current regional adjusted prices and GBP exchange rates
        run: python -u research/global_alpha/v14_source_probe.py 2>&1 | tee v14_probe.log
      - name: Save source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-alpha-v14-source-probe
          path: |
            results/v14_source_probe.json
            v14_probe.log
          if-no-files-found: warn
          retention-days: 30
