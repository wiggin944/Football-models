name: Global Alpha v26 chronological 11-country intraday ML
on:
  push:
    branches:
      - research/global-alpha-v26-intraday-ml-pilot
    paths:
      - research/global_alpha/v26_causal_intraday_ml.py
      - .github/workflows/global-alpha-v13b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intraday-causal-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install model and source dependencies
        run: python -m pip install numpy pandas pyarrow scikit-learn yfinance joblib
      - name: Static syntax test
        run: python -m py_compile research/global_alpha/v26_causal_intraday_ml.py
      - name: Real 30-day worldwide intraday forecast validation
        run: |
          set -o pipefail
          python -u research/global_alpha/v26_causal_intraday_ml.py 2>&1 | tee v26_intraday_ml_run.log
      - name: Keep raw price snapshot and all predictions for reproducibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-alpha-v26-intraday-ml-full-results
          path: |
            results/v26_intraday_raw_snapshot.parquet
            results/v26_intraday_ml_research.json
            results/v26_selected_intraday_ml.joblib
            v26_intraday_ml_run.log
          if-no-files-found: warn
          retention-days: 70
