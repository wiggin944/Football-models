name: Global Alpha v14 frozen 2025-26 out-of-time study
on:
  push:
    branches:
      - research/global-alpha-v14-forward-holdout
    paths:
      - research/global_alpha/**
      - .github/workflows/global-alpha-v13b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v14-frozen-test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install numerical and market-data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn requests yfinance
      - name: Static validation of frozen research code
        run: python -m py_compile research/global_alpha/v14_frozen_holdout.py
      - name: Execute frozen 2025-26 global out-of-time experiment
        run: python -u research/global_alpha/v14_frozen_holdout.py 2>&1 | tee global_alpha_v14.log
      - name: Archive results and run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-alpha-v14-frozen-holdout-results
          path: |
            results/v14_frozen_holdout_results.json
            global_alpha_v14.log
          if-no-files-found: warn
          retention-days: 30
