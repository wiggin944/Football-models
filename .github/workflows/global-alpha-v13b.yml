name: Global Alpha v15 SEC point-in-time event ablation
on:
  push:
    branches:
      - research/global-alpha-v15-earnings-context
    paths:
      - research/global_alpha/**
      - .github/workflows/global-alpha-v13b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sec-event-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install modelling and market-data packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn requests yfinance
      - name: Static check
        run: python -m py_compile research/global_alpha/v15_sec_earnings_ablation.py
      - name: US SEC filing-context vs price and shuffled placebo
        run: python -u research/global_alpha/v15_sec_earnings_ablation.py 2>&1 | tee v15_sec_ablation.log
      - name: Archive SEC experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-alpha-v15-sec-filing-context
          path: |
            results/v15_sec_earnings_ablation.json
            v15_sec_ablation.log
          if-no-files-found: warn
          retention-days: 30
