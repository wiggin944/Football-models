name: Global Alpha v17 SEC original-filing archive access
on:
  push:
    branches:
      - research/global-alpha-v17-sec-pit-gate
    paths:
      - research/global_alpha/**
      - .github/workflows/global-alpha-v13b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install requests
      - name: Probe official SEC as-filed archive access
        run: |
          set -o pipefail
          python -u research/global_alpha/v17_sec_quarter_probe.py 2>&1 | tee v17_sec_probe.log
      - name: Save bounded download diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-alpha-v17-sec-access-gate
          path: |
            results/v17_sec_quarter_access.json
            v17_sec_probe.log
          if-no-files-found: error
          retention-days: 30
