name: Global Alpha v13C China continuity experiment
on:
  push:
    branches:
      - research/global-alpha-v13c-china-bridge
    paths:
      - research/global_alpha/**
      - .github/workflows/global-alpha-v13b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn requests
      - name: Run China cross-index price continuity audit and replay
        run: |
          python -u research/global_alpha/v13c_china_bridge.py 2>&1 | tee global_alpha_china_bridge_run.log
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-alpha-v13c-china-bridge
          path: |
            results/
            global_alpha_china_bridge_run.log
          if-no-files-found: warn
          retention-days: 30
