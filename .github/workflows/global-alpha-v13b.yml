name: Global Alpha v27 simple global factor archives source validation
on:
  push:
    branches:
      - research/global-alpha-v27-simple-global-factors
    paths:
      - research/global_alpha/v27_french_source_probe.py
      - .github/workflows/global-alpha-v13b.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factor-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install archive reader
        run: python -m pip install requests
      - name: Audit 12 global quality-value-momentum research return files
        run: |
          set -o pipefail
          python -u research/global_alpha/v27_french_source_probe.py 2>&1 | tee v27_factor_source.log
      - name: Save source metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-alpha-v27-factor-source
          path: v27_factor_source.log
          if-no-files-found: warn
